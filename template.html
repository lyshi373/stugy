<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230078D4'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='14' font-weight='bold' text-anchor='middle' fill='white'%3E学%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#40A9FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>学习打卡日历</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --primary:#1890FF;--accent:#40A9FF;
    --bg:#f0f6fc;--card:#ffffff;--card-hover:#e6f4ff;
    --text:#1f2937;--text-dim:#6b7280;--border:#d6e4f0;
    --success:#16a34a;--warning:#f59e0b;--danger:#ef4444;
    --kp-bg:#e6f4ff;--kp-border:#bae0ff;--kp-text:#1f2937;--kp-label:#1890FF;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;
  }
  header{
    background:linear-gradient(135deg,#1890FF 0%,#40A9FF 50%,#69C0FF 100%);
    padding:30px 20px 24px;padding-top:calc(30px + env(safe-area-inset-top));
  }
  .header-inner{max-width:900px;margin:0 auto;}
  .back-link{
    color:rgba(255,255,255,.8);font-size:13px;text-decoration:none;
    display:inline-block;margin-bottom:10px;
  }
  header h1{font-size:22px;color:#fff;margin-bottom:4px;font-weight:600;}
  header .subtitle{font-size:13px;color:rgba(255,255,255,.85);margin-bottom:14px;line-height:1.5;}
  .app-ver{font-size:11px;font-weight:400;color:rgba(255,255,255,.85);background:rgba(255,255,255,.18);padding:2px 7px;border-radius:6px;vertical-align:middle;margin-left:6px;}
  .progress-wrap{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:rgba(0,0,0,.2);padding:10px 14px;border-radius:8px;
  }
  .progress-info{font-size:14px;color:#fff;min-width:140px;}
  .progress-info b{font-size:20px;}
  .progress-bar{flex:1;min-width:120px;height:8px;background:rgba(0,0,0,.3);border-radius:4px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,#16a34a,#4ade80);border-radius:4px;transition:width .3s;}
  .mode-toggle{
    display:flex;gap:4px;background:rgba(0,0,0,.2);padding:3px;border-radius:6px;
  }
  .mode-btn{
    padding:5px 12px;font-size:12px;border:none;cursor:pointer;
    background:transparent;color:rgba(255,255,255,.7);border-radius:4px;
  }
  .mode-btn.active{background:rgba(255,255,255,.2);color:#fff;}
  main{max-width:900px;margin:0 auto;padding:24px 16px 60px;}
  .section-title{font-size:15px;color:var(--text);margin-bottom:16px;display:flex;align-items:center;gap:8px;}
  .section-title::before{content:'';width:3px;height:16px;background:var(--primary);border-radius:2px;}
  .calendar-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;
  }
  .day-card{
    background:var(--card);border:1px solid var(--border);border-radius:10px;
    padding:16px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;
  }
  .day-card:hover{background:var(--card-hover);border-color:var(--primary);transform:translateY(-2px);}
  .day-card.locked{opacity:.5;cursor:not-allowed;}
  .day-card.locked:hover{transform:none;}
  .day-card.done{border-color:var(--success);}
  .day-num{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:4px;}
  .day-title{font-size:14px;color:var(--text);font-weight:500;margin-bottom:6px;line-height:1.4;}
  .day-desc{font-size:12px;color:var(--text-dim);line-height:1.5;}
  .day-status{
    position:absolute;top:0;right:0;width:0;height:0;
    border-style:solid;border-width:0 32px 32px 0;
    border-color:transparent var(--success) transparent transparent;
  }
  .day-status.done::after{
    content:'✓';position:absolute;top:4px;right:-24px;
    color:#fff;font-size:14px;font-weight:bold;
  }
  .day-lock{font-size:12px;color:var(--text-dim);margin-top:6px;}
  /* 模态弹窗 */
  .modal-mask{
    position:fixed;inset:0;background:rgba(0,0,0,.7);
    display:none;align-items:flex-start;justify-content:center;
    z-index:1000;padding:20px;overflow-y:auto;
  }
  .modal-mask.show{display:flex;}
  .modal{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    max-width:720px;width:100%;overflow:hidden;margin:auto;
  }
  .modal-header{
    padding:16px 20px;border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;
    position:sticky;top:0;background:var(--card);z-index:10;
  }
  .modal-header h2{font-size:16px;color:var(--text);}
  .modal-header .day-label{font-size:12px;color:var(--accent);margin-bottom:2px;}
  .close-btn{
    background:transparent;border:none;color:var(--text-dim);
    font-size:24px;cursor:pointer;width:36px;height:36px;
    display:flex;align-items:center;justify-content:center;border-radius:6px;
  }
  .close-btn:hover{background:var(--card-hover);color:var(--text);}
  .modal-body{padding:20px;max-height:calc(100vh - 140px);overflow-y:auto;}
  /* 编辑模式样式 */
  .edit-section{margin-bottom:20px;}
  .edit-label{font-size:13px;color:var(--text-dim);margin-bottom:6px;display:block;}
  .edit-input,.edit-textarea{
    width:100%;background:#e6f4ff;border:1px solid var(--border);
    color:var(--text);padding:10px 12px;border-radius:6px;font-size:14px;
    font-family:inherit;
  }
  .edit-input:focus,.edit-textarea:focus{outline:none;border-color:var(--primary);}
  .edit-textarea{min-height:60px;resize:vertical;}
  .video-edit-list{margin-bottom:8px;}
  .video-edit-item{
    background:#e6f4ff;border:1px solid var(--border);border-radius:6px;
    padding:10px;margin-bottom:8px;
  }
  .video-edit-row{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
  .video-edit-row input{flex:1;min-width:120px;}
  .video-edit-row .v-bv{max-width:160px;}
  .video-edit-row .v-page{max-width:80px;}
  .video-edit-del{
    background:transparent;border:1px solid var(--danger);
    color:var(--danger);padding:4px 10px;border-radius:4px;
    font-size:12px;cursor:pointer;
  }
  .add-video-btn,.add-kp-btn{
    background:transparent;border:1px dashed var(--border);
    color:var(--text-dim);padding:8px 14px;border-radius:6px;
    font-size:13px;cursor:pointer;width:100%;text-align:center;
  }
  .add-video-btn:hover,.add-kp-btn:hover{border-color:var(--primary);color:var(--accent);}
  .kp-edit-list{margin-bottom:8px;}
  .kp-edit-item{
    display:flex;gap:8px;margin-bottom:6px;align-items:center;
  }
  .kp-edit-item input{flex:1;}
  .kp-edit-item .kp-num{
    font-size:12px;color:var(--text-dim);min-width:24px;text-align:right;
  }
  /* 学习模式样式 */
  .goal-block{
    background:linear-gradient(135deg,rgba(0,120,212,.1),rgba(0,188,242,.05));
    border-left:3px solid var(--primary);
    padding:14px 16px;border-radius:6px;margin-bottom:18px;
  }
  .goal-block .label{font-size:11px;color:var(--accent);font-weight:600;margin-bottom:4px;}
  .goal-block .text{font-size:14px;color:var(--text);}
  .points-list{margin-bottom:20px;}
  .points-list h3{font-size:14px;color:var(--text);margin-bottom:10px;}
  .points-list ol{margin:0;padding-left:20px;}
  .points-list li{font-size:13px;color:var(--text-dim);padding:4px 0;line-height:1.7;}
  .video-section{margin-bottom:20px;}
  .video-section h3{font-size:14px;color:var(--text);margin-bottom:10px;}
  .video-item{
    background:#e6f4ff;border:1px solid var(--border);border-radius:8px;
    margin-bottom:12px;overflow:hidden;
  }
  .video-item iframe{width:100%;height:360px;border:none;display:block;}
  .video-meta{
    padding:10px 14px;display:flex;justify-content:space-between;align-items:center;
    font-size:12px;color:var(--text-dim);flex-wrap:wrap;gap:6px;
  }
  .video-meta a{color:var(--accent);text-decoration:none;font-size:12px;}
  .video-title{color:var(--text);font-size:13px;}
  /* 手机端视频卡片 - 唤起B站App */
  .video-mobile-card{
    padding:20px 16px;text-align:center;
  }
  .video-mobile-card .vm-icon{font-size:40px;margin-bottom:10px;}
  .video-mobile-card .vm-title{
    font-size:14px;color:var(--text);font-weight:500;margin-bottom:4px;line-height:1.4;
  }
  .video-mobile-card .vm-desc{
    font-size:12px;color:var(--text-dim);margin-bottom:14px;
  }
  .app-open-btn{
    display:block;background:linear-gradient(135deg,#fb7299,#fc3a6e);
    color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;
    font-weight:600;text-decoration:none;text-align:center;
    transition:all .2s;
  }
  .app-open-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(252,58,110,.4);}
  .app-open-btn:active{transform:translateY(0);}
  .app-open-btn small{display:block;font-size:11px;font-weight:400;opacity:.85;margin-top:2px;}
  .kp-card{
    background:var(--kp-bg);border:1px solid var(--kp-border);
    border-radius:6px;padding:12px 14px;margin:0 14px 14px;
  }
  .kp-card .kp-title{
    font-size:12px;color:var(--kp-label);font-weight:600;
    margin-bottom:8px;padding-bottom:6px;border-bottom:1px dashed var(--kp-border);
  }
  .kp-card ul{margin:0;padding-left:18px;}
  .kp-card li{font-size:12px;color:var(--kp-text);line-height:1.7;margin-bottom:3px;}
  .note-section{margin-bottom:20px;}
  .note-section h3{font-size:14px;color:var(--text);margin-bottom:8px;}
  .note-section .hint{font-size:11px;color:var(--text-dim);margin-bottom:6px;}
  textarea{
    width:100%;min-height:100px;background:#e6f4ff;border:1px solid var(--border);
    color:var(--text);padding:12px;border-radius:6px;font-size:14px;font-family:inherit;resize:vertical;
  }
  textarea:focus{outline:none;border-color:var(--primary);}
  .word-count{font-size:11px;color:var(--text-dim);margin-top:4px;text-align:right;}
  .word-count.ready{color:var(--success);}
  .checkin-bar{
    display:flex;justify-content:space-between;align-items:center;
    gap:12px;padding-top:14px;border-top:1px solid var(--border);
    flex-wrap:wrap;
  }
  .checkin-status{font-size:12px;color:var(--text-dim);padding:6px 0;}
  .checkin-status.done{color:var(--success);}
  .export-btn{
    background:#e6f4ff;border:1px solid var(--primary);
    color:var(--primary);padding:8px 14px;border-radius:6px;
    font-size:13px;cursor:pointer;text-decoration:none;display:inline-block;
    font-weight:500;
  }
  .export-btn:hover{background:#bae0ff;border-color:var(--primary);color:#0050b3;}
  .checkin-btn{
    background:linear-gradient(135deg,var(--primary),var(--accent));
    color:#fff;border:none;padding:10px 24px;border-radius:6px;
    font-size:14px;cursor:pointer;font-weight:500;
  }
  .checkin-btn:disabled{opacity:.4;cursor:not-allowed;}
  .checkin-btn.done{background:var(--success);}
  .toast{
    position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);
    background:var(--success);color:#fff;padding:10px 20px;border-radius:8px;
    font-size:13px;z-index:2000;transition:transform .3s;
    bottom:calc(30px + env(safe-area-inset-bottom));
  }
  .toast.show{transform:translateX(-50%) translateY(0);}
  .toast.error{background:#dc2626;}
  .empty-tip{
    text-align:center;padding:40px 20px;color:var(--text-dim);
  }
  .empty-tip h3{font-size:16px;color:var(--text);margin-bottom:10px;}
  .empty-tip p{font-size:13px;margin-bottom:6px;}
  .empty-tip .switch-hint{
    margin-top:16px;padding:12px;background:rgba(0,120,212,.08);
    border-radius:8px;font-size:13px;color:var(--accent);
  }
  /* 教程管理面板 */
  .tutorial-manager{
    background:linear-gradient(135deg,rgba(0,120,212,.12),rgba(0,188,242,.06));
    border:1px solid rgba(0,120,212,.3);border-radius:10px;
    padding:16px;margin-bottom:20px;
  }
  .tm-title{
    font-size:14px;color:var(--accent);font-weight:600;margin-bottom:12px;
    display:flex;align-items:center;gap:8px;
  }
  .tm-title::before{content:'🎛️';font-size:16px;}
  .tm-desc{
    font-size:12px;color:var(--text-dim);margin-bottom:14px;line-height:1.6;
  }
  .tm-btns{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
    gap:8px;margin-bottom:12px;
  }
  .tm-btn{
    background:rgba(0,120,212,.15);border:1px solid rgba(0,120,212,.4);
    color:var(--accent);padding:10px 12px;border-radius:6px;
    font-size:12px;cursor:pointer;transition:all .2s;
    display:flex;align-items:center;justify-content:center;gap:6px;
    text-align:center;
  }
  .tm-btn:hover{background:rgba(0,120,212,.3);border-color:var(--primary);}
  .tm-btn.danger{
    background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.4);color:#f87171;
  }
  .tm-btn.danger:hover{background:rgba(239,68,68,.25);border-color:#ef4444;}
  .tm-btn.success{
    background:rgba(22,163,74,.1);border-color:rgba(22,163,74,.4);color:#4ade80;
  }
  .tm-btn.success:hover{background:rgba(22,163,74,.25);border-color:#16a34a;}
  /* 快速分配区 */
  .tm-quick{
    background:#e6f4ff;border:1px solid var(--border);border-radius:8px;
    padding:14px;margin-top:8px;
  }
  .tm-quick-title{
    font-size:13px;color:var(--text);font-weight:500;margin-bottom:10px;
    display:flex;align-items:center;gap:6px;
  }
  .tm-quick-title::before{content:'⚡';}
  .tm-quick-row{
    display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;
  }
  .tm-quick-row input{
    flex:1;min-width:140px;background:var(--card);border:1px solid var(--border);
    color:var(--text);padding:8px 10px;border-radius:5px;font-size:13px;
  }
  .tm-quick-row input:focus{outline:none;border-color:var(--primary);}
  .tm-quick-row .v-bv{max-width:200px;}
  .tm-quick-row .v-total{max-width:100px;}
  .tm-quick-btn{
    background:var(--primary);color:#fff;border:none;
    padding:8px 16px;border-radius:5px;font-size:12px;cursor:pointer;
    white-space:nowrap;
  }
  .tm-quick-btn:hover{background:#1890FF;}
  .tm-quick-hint{
    font-size:11px;color:var(--text-dim);margin-top:6px;line-height:1.5;
  }
  /* 模板选择列表 */
  .tm-templates{
    display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);
  }
  .tm-templates.show{display:block;}
  .tm-tpl-item{
    background:var(--card);border:1px solid var(--border);border-radius:6px;
    padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:all .2s;
    display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  .tm-tpl-item:hover{border-color:var(--primary);background:var(--card-hover);}
  .tm-tpl-info{flex:1;min-width:0;}
  .tm-tpl-name{font-size:13px;color:var(--text);font-weight:500;margin-bottom:2px;}
  .tm-tpl-desc{font-size:11px;color:var(--text-dim);line-height:1.4;}
  .tm-tpl-apply{
    background:rgba(0,120,212,.2);border:1px solid var(--primary);
    color:var(--accent);padding:5px 10px;border-radius:4px;font-size:11px;
    cursor:pointer;white-space:nowrap;
  }
  /* 响应式 */
  @media(max-width:768px){
    header{padding:24px 18px 22px;}
    header h1{font-size:20px;}
    .modal-body{padding:16px;max-height:calc(100vh - 120px);}
    .video-item iframe{height:340px;}
    .progress-wrap{flex-wrap:wrap;gap:10px;padding:12px 14px;}
    .calendar-grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;}
  }
  @media(max-width:640px){
    header{padding:18px 14px 16px;padding-top:calc(18px + env(safe-area-inset-top));}
    header h1{font-size:18px;}
    header .subtitle{font-size:12px;}
    main{padding:18px 12px 40px;}
    .calendar-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
    .day-card{padding:14px 12px;}
    .progress-wrap{flex-direction:column;align-items:stretch;gap:10px;padding:12px;}
    .progress-info{text-align:center;}
    .mode-toggle{width:100%;justify-content:center;}
    .mode-btn{flex:1;text-align:center;}
    .modal-mask{padding:0;}
    .modal{max-width:100%;border-radius:0;min-height:100vh;}
    .modal-header{padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));}
    .modal-body{padding:14px;max-height:none;}
    .video-item iframe{height:220px;}
    .video-edit-row input{min-width:100px;}
    .checkin-bar{flex-direction:column;align-items:stretch;}
    .checkin-btn{width:100%;padding:12px;}
    .export-btn{width:100%;text-align:center;padding:10px;}
    /* 教程管理面板手机适配 */
    .tm-btns{grid-template-columns:1fr 1fr;}
    .tm-btn{padding:9px 8px;font-size:11px;}
    .tm-quick-row{flex-direction:column;}
    .tm-quick-row input{max-width:none;}
    .tm-quick-btn{width:100%;padding:10px;}
    .toast{left:12px;right:12px;transform:translateY(100px);text-align:center;}
    .toast.show{transform:translateY(0);}
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <a href="./index.html" class="back-link">← 返回打卡中心</a>
    <h1 id="pageTitle">学习打卡日历 <span class="app-ver">v20260812</span></h1>
    <div class="subtitle" id="pageSubtitle"></div>
    <div class="progress-wrap">
      <div class="progress-info">已完成 <b id="doneCount">0</b> / <span id="totalCount">10</span> 天</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%;"></div></div>
      <div class="mode-toggle">
        <button class="mode-btn active" id="modeLearn" onclick="setMode('learn')">📖 学习</button>
        <button class="mode-btn" id="modeEdit" onclick="setMode('edit')">✏️ 编辑</button>
      </div>
      <button class="export-btn" onclick="changeTotalDays()">⚙ 修改天数</button>
      <button class="export-btn" onclick="exportAllWord()">导出全部笔记</button>
      <button class="export-btn" onclick="resetProgress()" style="border-color:var(--danger);color:var(--danger);">重置</button>
    </div>
  </div>
</header>

<main>
  <div class="section-title" id="sectionTitle">学习日历</div>
  <div class="calendar-grid" id="calendarGrid"></div>
</main>

<!-- 打卡详情弹窗 -->
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="day-label" id="modalDayLabel"></div>
        <h2 id="modalTitle"></h2>
      </div>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 修改学习天数弹窗（不依赖 prompt，兼容手机端） -->
<div class="modal-mask" id="daysModal">
  <div class="modal" style="max-width:360px;">
    <div class="modal-header">
      <h2>修改学习天数</h2>
      <button class="close-btn" onclick="closeDaysModal()">×</button>
    </div>
    <div class="modal-body" style="padding:20px;">
      <p id="daysModalInfo" style="font-size:13px;color:var(--text-dim);margin-bottom:12px;line-height:1.6;"></p>
      <input type="number" id="daysInput" min="1" max="365" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;font-size:16px;box-sizing:border-box;">
      <div style="margin-top:14px;display:flex;gap:8px;">
        <button class="export-btn" onclick="closeDaysModal()" style="flex:1;text-align:center;">取消</button>
        <button class="checkin-btn" onclick="applyDaysChange()" style="flex:1;">确认修改</button>
      </div>
    </div>
  </div>
</div>

<script>
// 清理遗留 Service Worker 与缓存
// 旧 SW 缓存了旧版 template.html，导致修改天数/自动总结等新功能不生效
// 主动卸载所有遗留 SW 并清空缓存，刷新一次后即可加载最新代码
// 每次更新代码时，请递增 CACHE_VERSION 常量
const CACHE_VERSION = "v7"; // 与 sw.js 中的 CACHE_NAME 保持一致
(function(){
  if(!('serviceWorker' in navigator)) return;
  
  // 检查缓存版本号是否变化
  const lastVersion = localStorage.getItem('sw_cache_version');
  const versionChanged = lastVersion !== CACHE_VERSION;
  
  // 如果版本号变化或首次运行，强制清理
  if(versionChanged){
    navigator.serviceWorker.getRegistrations().then(function(regs){
      regs.forEach(function(r){ r.unregister(); });
      if(window.caches){
        caches.keys().then(function(keys){ keys.forEach(function(k){ caches.delete(k); }); });
      }
      // 更新版本号
      localStorage.setItem('sw_cache_version', CACHE_VERSION);
      // 清理后刷新一次
      location.reload();
    });
    return;
  }
  
  // 原有清理逻辑（兼容旧版本）
  navigator.serviceWorker.getRegistrations().then(function(regs){
    if(!regs.length) return;
    regs.forEach(function(r){ r.unregister(); });
    if(window.caches){
      caches.keys().then(function(keys){ keys.forEach(function(k){ caches.delete(k); }); });
    }
    if(!sessionStorage.getItem('sw_cleaned_tpl')){
      sessionStorage.setItem('sw_cleaned_tpl','1');
      location.reload();
    }
  });
})();

function loadDayContent(day){
  // 加载某天的编辑内容（视频、知识点、目标等）
  const contentKey = STORAGE_KEY + "_content";
  const all = JSON.parse(localStorage.getItem(contentKey) || "{}");
  const saved = all[day] || all[String(day)];
  // 只有用户真正编辑过（有 title/goal/videos/knowledge 任一非空）才使用存储的内容
  if(saved && (saved.title || saved.goal || (saved.videos && saved.videos.length) || (saved.knowledge && saved.knowledge.length))){
    return saved;
  }
  // 使用预填充默认内容
  const plan = PRESET_PLANS[SOFTWARE_ID];
  if(plan && plan[day]){
    return JSON.parse(JSON.stringify(plan[day]));
  }
  return {
    title:`第 ${day} 天`,
    goal:"",
    videos:[],
    knowledge:[]
  };
}

// 把所有学习内容（视频和知识点）扁平化成列表，然后平均分配到新天数
// 无论多少天，内容总量保持不变，只是每天分配的数量不同
function redistributePlan(newDays){
  const contentKey = STORAGE_KEY + "_content";
  const savedContent = JSON.parse(localStorage.getItem(contentKey) || "{}");
  const preset = PRESET_PLANS[SOFTWARE_ID];
  
  // 收集所有视频和知识点，扁平化成列表
  const allVideos = [];
  const allKnowledge = [];
  const allGoals = [];
  
  // 从 _content 收集
  const existingDays = Object.keys(savedContent).map(Number).sort((a,b)=>a-b);
  const maxDay = Math.max(...existingDays, 0);
  
  for(let d=1; d<=maxDay; d++){
    let item = savedContent[d] || savedContent[String(d)];
    if(!item || (!item.title && !item.goal && (!item.videos || !item.videos.length) && (!item.knowledge || !item.knowledge.length))){
      if(preset && preset[d]) item = preset[d];
    }
    if(!item) continue;
    if(item.videos) allVideos.push(...item.videos);
    if(item.knowledge) allKnowledge.push(...item.knowledge);
    if(item.goal) allGoals.push(item.goal);
  }
  
  // 如果 _content 没有有效数据，从 PRESET_PLANS 收集
  if(allVideos.length === 0 && allKnowledge.length === 0 && preset){
    for(let d in preset){
      const item = preset[d];
      if(item.videos) allVideos.push(...item.videos);
      if(item.knowledge) allKnowledge.push(...item.knowledge);
      if(item.goal) allGoals.push(item.goal);
    }
  }
  
  // 如果还是没有有效数据
  if(allVideos.length === 0 && allKnowledge.length === 0) return null;
  
  // 平均分配函数
  function distributeEvenly(items, days){
    const groups = [];
    const total = items.length;
    if(total === 0) return groups;
    
    const base = Math.floor(total / days);
    const remainder = total % days;
    
    let idx = 0;
    for(let d=1; d<=days; d++){
      // 前 remainder 天多分配一个
      const count = base + (d <= remainder ? 1 : 0);
      const group = items.slice(idx, idx + count);
      groups.push(group);
      idx += count;
    }
    return groups;
  }
  
  // 平均分配视频和知识点
  const videoGroups = distributeEvenly(allVideos, newDays);
  const kpGroups = distributeEvenly(allKnowledge, newDays);
  
  // 生成新的学习计划
  const result = {};
  for(let nd=1; nd<=newDays; nd++){
    const vids = videoGroups[nd - 1] || [];
    const kps = kpGroups[nd - 1] || [];
    
    // 生成标题
    const vidInfo = vids.length ? `第 ${vids.map(v=>v.page).join('、')} 集` : '休息';
    const title = vids.length || kps.length ? 
      (nd === 1 ? `第 ${vidInfo} （共 ${allVideos.length} 集，${newDays} 天学完）` : vidInfo) : 
      `第 ${nd} 天（复习）`;
    
    // 生成学习目标
    let goal = "";
    if(nd === 1 && allGoals.length){
      goal = allGoals[0]; // 第一天显示主要目标
    } else if(vids.length === 0 && kps.length === 0){
      goal = "本日休息或复习已学内容";
    } else {
      goal = `学习 ${vidInfo}`;
      if(kps.length) goal += `，掌握 ${kps.length} 个知识点`;
    }
    
    result[nd] = {
      title: title,
      goal: goal,
      videos: vids,
      knowledge: kps
    };
  }
  
  return result;
}

// ============ 渲染日历 ============
function renderCalendar(){
  const data = loadData();
  const grid = document.getElementById("calendarGrid");
  let html = "";
  let doneCount = 0;

  for(let day=1; day<=TOTAL_DAYS; day++){
    const dayData = data[day] || {};
    const isDone = dayData.checked;
    const isLocked = day > 1 && !(data[day-1] && data[day-1].checked);
    const content = loadDayContent(day);

    if(isDone) doneCount++;

    html += `
      <div class="day-card ${isDone?'done':''} ${isLocked?'locked':''}" onclick="${isLocked?'':`openDay(${day})`}">
        ${isDone?'<div class="day-status done"></div>':''}
        <div class="day-num">DAY ${day}</div>
        <div class="day-title">${content.title || '第 '+day+' 天'}</div>
        <div class="day-desc">${content.goal ? content.goal.substring(0,50)+(content.goal.length>50?'...':'') : '点击编辑设置学习内容'}</div>
        ${isLocked?`<div class="day-lock">🔒 完成第 ${day-1} 天解锁</div>`:''}
        ${!isLocked && !content.videos.length && !content.goal ? '<div class="day-lock">✏️ 待编辑</div>':''}
      </div>
    `;
  }
  grid.innerHTML = html;

  // 更新进度
  document.getElementById("doneCount").textContent = doneCount;
  const pct = Math.round(doneCount/TOTAL_DAYS*100);
  document.getElementById("progressFill").style.width = pct+"%";
}

// 获取视频的 embed URL
function getVideoEmbedUrl(v, autoplay){
  const bv = v.bv || "";
  const page = v.page || 1;
  return `https://player.bilibili.com/player.html?bvid=${bv}&page=${page}&as_wide=1&high_quality=1&autoplay=${autoplay?'1':'0'}`;
}

// 停止视频播放（将 iframe 的 src 设为 blank）
function stopAllVideos(){
  const iframe = document.getElementById("main-video-iframe");
  if(iframe){
    iframe.src = "about:blank";
  }
}

// 切换视频（修改 iframe 的 src）
function switchVideo(targetIdx){
  if(currentDay === 0) return;
  const content = loadDayContent(currentDay);
  if(!content.videos || !content.videos[targetIdx]) return;
  
  const v = content.videos[targetIdx];
  const bv = v.bv;
  if(!bv) return;
  
  const page = v.page || 1;
  const title = v.title || `第 ${targetIdx+1} 个视频`;
  const link = `https://www.bilibili.com/video/${bv}/?p=${page}`;
  const embed = getVideoEmbedUrl(v, true); // autoplay
  
  currentVideoIdx = targetIdx;
  
  // 直接修改 iframe 的 src
  const iframe = document.getElementById("main-video-iframe");
  if(iframe){
    iframe.src = embed;
  }
  
  // 更新视频标题显示
  const titleEl = document.getElementById("current-video-title");
  if(titleEl){
    titleEl.innerHTML = `▶ ${escapeHtml(title)}`;
  }
  const metaEl = document.getElementById("current-video-meta");
  if(metaEl){
    metaEl.innerHTML = `<a href="${link}" target="_blank">在B站原页观看 →</a>`;
  }
}

// 自动生成本日总结文字（基于当天学习内容拼接，无需手写）
// day 参数：无 title 且有 day 时生成 "DAY X 学习总结" 兜底，避免自定义软件无内容时空总结
function generateSummary(content, day){
  const parts = [];
  if(content.title) parts.push("今天学习「" + content.title + "」");
  if(content.goal){
    const g = content.goal.replace(/[。.，,；;]+$/,""); // 去掉末尾标点，避免拼接时重叠
    parts.push("目标是" + g);
  }
  if(content.knowledge && content.knowledge.length){
    parts.push("重点掌握：" + content.knowledge.join("；")); // 不再截断，全部知识点参与总结
  }
  if(content.videos && content.videos.length){
    const titled = content.videos.filter(v=>v && v.title).map(v=>v.title);
    parts.push("共" + content.videos.length + "个学习视频" + (titled.length ? "：" + titled.join("、") : ""));
  }
  // 兜底：完全无内容时，仍生成一段 DAY X 学习总结占位文字
  if(!parts.length){
    const label = day ? `DAY ${day}` : "本日";
    return `${label}学习总结：请在编辑模式填写学习目标、视频和知识点，系统会自动归纳重点。`;
  }
  return parts.join("，") + "。";
}

      const firstPage = firstVideo.page || 1;
      const firstTitle = firstVideo.title || `第 1 个视频`;
      const firstLink = `https://www.bilibili.com/video/${firstBv}/?p=${firstPage}`;
      const firstEmbed = firstBv ? getVideoEmbedUrl(firstVideo, false) : "";
      
      // 主播放区域（只有一个 iframe）
      if(firstBv){
        html += `
          <div class="video-item" style="margin-bottom:16px;">
            <iframe id="main-video-iframe" src="${firstEmbed}" scrolling="no" border="0" frameborder="no" framespacing="0"
              allowfullscreen="true" referrerpolicy="no-referrer"
              allow="fullscreen; encrypted-media; picture-in-picture"
              sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-presentation"></iframe>
            <div class="video-meta">
              <span class="video-title" id="current-video-title">▶ ${escapeHtml(firstTitle)}</span>
              <span id="current-video-meta"><a href="${firstLink}" target="_blank">在B站原页观看 →</a></span>
            </div>
          </div>
        `;
      } else {
        html += `
          <div class="video-item" style="padding:20px;text-align:center;color:var(--text-dim);">
            第一个视频未设置BV号，请在编辑模式填写
          </div>
        `;
      }
      
      // 其他视频切换按钮
      if(content.videos.length > 1){
        html += `<div style="margin-top:12px;"><div style="font-size:12px;color:var(--text-dim);margin-bottom:8px;">📋 视频列表（点击切换）</div>`;
        html += `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;">`;
        content.videos.forEach((v,i)=>{
          if(i === 0) return; // 第一个视频已经在主播放区
          const bv = v.bv || "";
          const page = v.page || 1;
          const title = v.title || `第 ${i+1} 个视频`;
          if(!bv){
            html += `<div style="padding:10px;background:var(--bg);border-radius:6px;font-size:12px;color:var(--text-dim);">${escapeHtml(title)} (未设置)</div>`;
            return;
          }
          html += `
            <button class="tm-btn" style="padding:10px 12px;font-size:12px;text-align:left;background:rgba(0,120,212,.1);border:1px solid rgba(0,120,212,.3);color:var(--accent);border-radius:6px;cursor:pointer;" onclick="switchVideo(${i})">
              <div style="font-weight:500;">${escapeHtml(title)}</div>
              <div style="font-size:11px;opacity:.7;">第 ${page} 集</div>
            </button>
          `;
        });
        html += `</div></div>`;
      }
    }
    html += `</div>`;
  }

  // 知识点（如果视频区没显示）
  if(content.knowledge && content.knowledge.length && (!content.videos || !content.videos.length)){
    html += `
      <div class="points-list">
        <h3>📘 知识点</h3>
        <ol>${content.knowledge.map(k=>`<li>${escapeHtml(k)}</li>`).join("")}</ol>
      </div>
    `;
  }

  // 本日总结（自动生成，空内容也会生成 DAY X 兜底提示）
  const summary = generateSummary(content, day);
  html += `
    <div style="background:rgba(24,144,255,.08);border-left:3px solid var(--primary);padding:10px 14px;border-radius:6px;margin:12px 0;">
      <div style="font-size:13px;color:var(--primary);font-weight:600;margin-bottom:4px;">📝 本日总结</div>
      <div style="font-size:14px;color:var(--text);line-height:1.7;">${escapeHtml(summary)}</div>
    </div>
  `;

  // 笔记区
  html += `
    <div class="note-section">
      <h3>✍️ 学习笔记</h3>
      <div class="hint">至少输入 30 字才能完成打卡</div>
      <textarea id="noteArea" placeholder="今天学到了什么？记录下来吧..."></textarea>
      <div class="word-count" id="wordCount">0 / 30 字</div>
    </div>
  `;

  // 打卡按钮
  const isDone = dayData.checked;
  html += `
    <div class="checkin-bar">
      <div class="checkin-status ${isDone?'done':''}">
        ${isDone?`✓ 已完成打卡 (${dayData.checkTime||''})`:'未打卡'}
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="export-btn" onclick="exportDayWord(${day})">导出本日笔记</button>
        <button class="checkin-btn ${isDone?'done':''}" id="checkinBtn" ${isDone?'disabled':''} onclick="checkin(${day})">
          ${isDone?'已完成打卡':'完成打卡'}
        </button>
      </div>
    </div>
  `;

  return html;
}

// ============ 教程管理 ============
// 获取所有天的内容
function loadAllContent(){
  const contentKey = STORAGE_KEY + "_content";
  return JSON.parse(localStorage.getItem(contentKey) || "{}");
}
function saveAllContent(all){
  localStorage.setItem(STORAGE_KEY + "_content", JSON.stringify(all));
}

// 导出教程为JSON文件
function exportTutorial(){
  const all = loadAllContent();
  const data = {
    software: SW_INFO.name,
    softwareId: SOFTWARE_ID,
    days: TOTAL_DAYS,
    exportTime: new Date().toLocaleString("zh-CN"),
    version: "1.0",
    content: all
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${SW_INFO.name}_教程_${TOTAL_DAYS}天.json`;
  a.click();
  showToast("✓ 教程已导出");
}

// 导入教程
function importTutorial(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      if(!data.content){
        showToast("文件格式错误", true);
        return;
      }
      if(!confirm(`确定导入「${data.software||'未知'}」的教程吗？\n这将替换当前所有编辑内容（打卡记录不受影响）。`)) return;
      saveAllContent(data.content);
      // 如果带有天数信息，同步天数
      if(data.days && data.days !== TOTAL_DAYS){
        TOTAL_DAYS = data.days;
        localStorage.setItem(DAYS_KEY, String(TOTAL_DAYS));
        document.getElementById("totalCount").textContent = TOTAL_DAYS;
      }
      showToast("✓ 教程导入成功");
      renderModalBody(currentDay);
      renderCalendar();
    }catch(err){
      showToast("导入失败：文件格式错误", true);
    }
  };
  reader.readAsText(file);
  event.target.value = ""; // 重置input，允许重复导入同一文件
}

// 清空教程
function clearTutorial(){
  if(!confirm("确定清空所有天的编辑内容吗？\n（打卡记录和笔记会保留，仅清空视频/知识点/目标）")) return;
  localStorage.removeItem(STORAGE_KEY + "_content");
  showToast("✓ 教程内容已清空");
  renderModalBody(currentDay);
  renderCalendar();
}

// B站合集快速分配
function quickDistribute(){
  const bv = document.getElementById("quickBv").value.trim();
  const total = parseInt(document.getElementById("quickTotal").value);
  if(!bv){
    showToast("请输入BV号", true);
    return;
  }
  if(!total || total < 1){
    showToast("请输入有效的总P数", true);
    return;
  }
  if(!confirm(`将 ${total} 集视频分配到 ${TOTAL_DAYS} 天，会覆盖现有的视频设置（知识点保留）。继续？`)) return;

  const all = loadAllContent();
  // 计算每天分配数量：均匀分配，余数给前几天
  const base = Math.floor(total / TOTAL_DAYS);
  let remainder = total % TOTAL_DAYS;
  let currentPage = 1;

  for(let day=1; day<=TOTAL_DAYS; day++){
    const count = base + (remainder > 0 ? 1 : 0);
    if(remainder > 0) remainder--;
    if(count === 0) continue;

    const dayContent = all[day] || {title:`第 ${day} 天`, goal:"", videos:[], knowledge:[]};
    const videos = [];
    for(let i=0; i<count; i++){
      videos.push({
        bv: bv,
        page: currentPage,
        title: `第 ${currentPage} 集`
      });
      currentPage++;
    }
    dayContent.videos = videos;
    // 自动生成标题和目标（如果为空）
    if(!dayContent.title || dayContent.title === `第 ${day} 天`){
      const startP = videos[0].page;
      const endP = videos[videos.length-1].page;
      dayContent.title = startP === endP ? `第 ${startP} 集` : `第 ${startP}-${endP} 集`;
    }
    if(!dayContent.goal){
      dayContent.goal = `学习视频第 ${videos[0].page} - ${videos[videos.length-1].page} 集`;
    }
    all[day] = dayContent;
  }
  saveAllContent(all);
  showToast(`✓ 已分配 ${total} 集视频到 ${TOTAL_DAYS} 天`);
  renderModalBody(currentDay);
  renderCalendar();
}

// 套用模板
function applyTemplate(tplId){
  const tpl = TUTORIAL_TEMPLATES.find(t=>t.id===tplId);
  if(!tpl) return;
  if(!confirm(`套用「${tpl.name}」模板？\n这将替换当前编辑内容。`)) return;
  // 同步天数
  if(tpl.days !== TOTAL_DAYS){
    TOTAL_DAYS = tpl.days;
    localStorage.setItem(DAYS_KEY, String(TOTAL_DAYS));
    document.getElementById("totalCount").textContent = TOTAL_DAYS;
  }
  saveAllContent(tpl.content);
  showToast(`✓ 已套用「${tpl.name}」模板`);
  renderModalBody(currentDay);
  renderCalendar();
}

// ============ 打卡 ============
function updateWordCount(){
  const ta = document.getElementById("noteArea");
  const wc = document.getElementById("wordCount");
  const btn = document.getElementById("checkinBtn");
  if(!ta || !wc || !btn) return;
  const len = ta.value.trim().length;
  wc.textContent = `${len} / 30 字`;
  wc.classList.toggle("ready", len>=30);
  btn.disabled = len<30;
}

function checkin(day){
  const ta = document.getElementById("noteArea");
  if(!ta || ta.value.trim().length < 30){
    showToast("请输入至少30字学习笔记");
    return;
  }
  const data = loadData();
  data[day] = data[day] || {};
  data[day].note = ta.value;
  data[day].checked = true;
  data[day].checkTime = new Date().toLocaleString("zh-CN");
  saveData(data);
  showToast(`✓ 第 ${day} 天打卡成功！`);
  renderModalBody(day);
}

  let html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">`;

    html += `<h3>学习视频</h3>`;
    content.videos.forEach(v=>{
      html += `<p>• ${v.title||'视频'} - <a href="https://www.bilibili.com/video/${v.bv}/?p=${v.page||1}">B站链接</a></p>`;

  if(content.knowledge && content.knowledge.length){
    html += `<h3>知识点</h3><div class="kp"><ol>${content.knowledge.map(k=>`<li>${k}</li>`).join("")}</ol></div>`;
  }
  const summary = generateSummary(content, day);
  if(summary){html += `<h3>本日总结</h3><p>${summary}</p>`;}

  a.click();
}

// ============ 修改学习总天数（页面内弹窗，不依赖 prompt） ============
function changeTotalDays(){
  const data = loadData();
  const doneCount = Object.keys(data).filter(k=>data[k] && data[k].checked).length;
  const info = doneCount > 0
    ? `当前已完成 ${doneCount} / ${TOTAL_DAYS} 天。请输入新的总天数（1-365，不能小于已完成的 ${doneCount} 天）：`
    : `当前进度 0 / ${TOTAL_DAYS} 天。请输入新的总天数（1-365）：`;
  document.getElementById("daysModalInfo").textContent = info;
  const input = document.getElementById("daysInput");
  input.value = TOTAL_DAYS;
  input.min = doneCount || 1;
  document.getElementById("daysModal").classList.add("show");
  setTimeout(()=>input.focus(), 100);
}
function closeDaysModal(){
  document.getElementById("daysModal").classList.remove("show");
}
function applyDaysChange(){
  const v = parseInt(document.getElementById("daysInput").value);
  const data = loadData();
  const doneCount = Object.keys(data).filter(k=>data[k] && data[k].checked).length;
  if(!v || v < 1 || v > 365){alert("请输入 1-365 之间的整数");return;}
  if(v < doneCount){alert(`新天数 ${v} 小于已完成的 ${doneCount} 天，请输入不小于 ${doneCount} 的数字`);return;}

  // 内置预填充软件：按新天数重新分配每天的视频/知识点
  const redistributed = redistributePlan(v);
  console.log("[改天数] SOFTWARE_ID=", SOFTWARE_ID, "新天数=", v, "重分配结果=", redistributed);
  if(redistributed){
    // 强制覆盖 _content（清空旧的，写入重分配结果）
    // 打卡记录和笔记存储在 STORAGE_KEY 中，不受影响，不会丢失
    if(!confirm(`将按 ${v} 天重新分配每天的学习内容（视频/知识点）。\n已编辑的内容会被覆盖，但打卡记录和笔记会保留。继续？`)) return;
    const contentKey = STORAGE_KEY + "_content";
    // 直接用重分配结果替换 _content
    const newContent = {};
    Object.keys(redistributed).forEach(day=>{
      newContent[parseInt(day)] = redistributed[day];
    });
    localStorage.setItem(contentKey, JSON.stringify(newContent));
  } else if(v < TOTAL_DAYS){
    // 非预填充软件或天数没变：仅清除超范围天内容
    const contentKey = STORAGE_KEY + "_content";
    const allContent = JSON.parse(localStorage.getItem(contentKey) || "{}");
    Object.keys(allContent).forEach(k=>{ if(parseInt(k) > v) delete allContent[k]; });
    localStorage.setItem(contentKey, JSON.stringify(allContent));
  }

  // 天数减少时：清除超范围天的打卡记录
  if(v < TOTAL_DAYS){
    const oldData = loadData();
    const newData = {};
    Object.keys(oldData).forEach(k=>{ if(parseInt(k) <= v) newData[k] = oldData[k]; });
    saveData(newData);
  }

  TOTAL_DAYS = v;
  localStorage.setItem(DAYS_KEY, String(TOTAL_DAYS));
  document.getElementById("totalCount").textContent = TOTAL_DAYS;
  renderCalendar();
  if(currentDay > 0) closeModal();
  closeDaysModal();
  const tip = redistributed ? `✓ 已修改为 ${TOTAL_DAYS} 天，并重新分配每天学习内容` : `✓ 已修改为 ${TOTAL_DAYS} 天学习计划`;
  showToast(tip);
}

// ============ 重置 ============
function resetProgress(){
  if(!confirm("确定重置所有打卡进度吗？编辑的内容（视频/知识点）不会丢失，但打卡记录和笔记会清空。"))return;
  localStorage.removeItem(STORAGE_KEY);
  showToast("打卡进度已重置");
  renderCalendar();
  if(currentDay > 0) closeModal();
}

// ============ 工具 ============
function escapeHtml(str){
  if(!str) return "";
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function showToast(msg, isError){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.toggle("error", !!isError);
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2500);
}

// 点击遮罩关闭
document.getElementById("modalMask").addEventListener("click", function(e){
  if(e.target === this) closeModal();
});

// ESC关闭
document.addEventListener("keydown", function(e){
  if(e.key === "Escape") closeModal();
});

// 初始化
renderCalendar();
</script>
